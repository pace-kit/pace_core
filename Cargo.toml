[package]
name = "pace_core"
version = "0.1.0"
edition = "2021"
rust-version = "1.97.1"

[dependencies]
bevy = { version = "=0.20.0", default-features = false, features = ["std", "async_executor"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
sha2 = "0.10"
tempfile = "3"

[features]
default = []
desktop = ["bevy/default_app", "bevy/ui_bevy_render", "bevy/bevy_ui_widgets", "bevy/ui_picking", "bevy/bevy_winit", "bevy/default_font", "bevy/x11", "bevy/keyboard", "bevy/mouse"]

[[example]]
name = "last_light"
required-features = ["desktop"]

[profile.dev]
debug = 0

[profile.test]
debug = 0
